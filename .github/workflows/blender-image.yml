name: Blender Kasm image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/blender-image.yml"
      - "docker/blender-runpod/**"
      - "src/scripts/blender_listener.py"
      - "src/scripts/blender_job.py"
      - "src/scripts/blender_mixdown.py"
      - "src/scripts/blender_gui_bootstrap.py"
      - "src/scripts/flamenco_control.py"
      - "src/scripts/flamenco_gateway.py"
      - "src/scripts/flamenco_gpu_bootstrap.py"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-council-blender
          tags: |
            type=raw,value=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/blender-runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Resolve immutable image reference
        id: image
        shell: bash
        run: |
          ref="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n 1)"
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Verify published registry manifest
        run: docker buildx imagetools inspect "${{ steps.image.outputs.ref }}"
      - name: Smoke-test Kasm desktop and safe agent
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          VNC_PASSWORD: kasm-ci-password
          AGENT_TOKEN: council-os-ci-agent-token-0123456789abcdef
          WORKER_PROXY_TOKEN: council-os-ci-worker-proxy-token-0123456789abcdef
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --rm --shm-size=512m \
            --env "VNC_PW=${VNC_PASSWORD}" \
            --env "BLENDER_AGENT_TOKEN=${AGENT_TOKEN}" \
            --env "FLAMENCO_WORKER_PROXY_TOKEN=${WORKER_PROXY_TOKEN}" \
            --publish 127.0.0.1::6901 \
            --publish 127.0.0.1::8001 \
            "${IMAGE_REF}")"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          kasm_port="$(docker port "${container_id}" 6901/tcp | awk -F: 'NR==1 {print $NF}')"
          agent_port="$(docker port "${container_id}" 8001/tcp | awk -F: 'NR==1 {print $NF}')"
          test -n "${kasm_port}"
          test -n "${agent_port}"

          kasm_ready=0
          for _ in $(seq 1 90); do
            if curl --silent --show-error --fail \
              --user "kasm_user:${VNC_PASSWORD}" \
              "http://127.0.0.1:${kasm_port}/" >/dev/null; then
              kasm_ready=1
              break
            fi
            sleep 2
          done
          test "${kasm_ready}" -eq 1

          agent_ready=0
          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail \
              --header "Authorization: Bearer ${AGENT_TOKEN}" \
              "http://127.0.0.1:${agent_port}/healthz" \
              | jq --exit-status '.status == "ok" or .status == "not_ready"' >/dev/null; then
              agent_ready=1
              break
            fi
            sleep 2
          done
          test "${agent_ready}" -eq 1

          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${AGENT_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"role":"coordinator"}' \
            "http://127.0.0.1:${agent_port}/v1/flamenco/processes/start" >/dev/null

          flamenco_ready=0
          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail \
              --header "Authorization: Bearer ${AGENT_TOKEN}" \
              "http://127.0.0.1:${agent_port}/v1/flamenco/status" \
              | jq --exit-status \
                '.expected_version == "3.9.3" and .manager.running and .worker.running and (.registered_workers | length) == 1' \
                >/dev/null; then
              flamenco_ready=1
              break
            fi
            sleep 1
          done
          test "${flamenco_ready}" -eq 1

          # The remote-Worker token may reach only the Worker proxy. It must
          # never authenticate to full pod-agent administration endpoints.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${WORKER_PROXY_TOKEN}" \
            "http://127.0.0.1:${agent_port}/healthz")" -eq 401
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${WORKER_PROXY_TOKEN}" \
            "http://127.0.0.1:${agent_port}/v1/flamenco/worker-proxy/api/v3/version" \
            | jq --exit-status '.version == "3.9.3"' >/dev/null

          docker exec "${container_id}" google-chrome --version \
            | grep --fixed-strings 'Google Chrome'
          docker exec --env HOME=/home/kasm-user "${container_id}" \
            xdg-mime query default text/html \
            | grep --fixed-strings 'google-chrome.desktop'
          docker exec "${container_id}" test -s \
            /opt/council/samples/BMW27_GPU.blend
          docker exec "${container_id}" test -x /usr/bin/ristretto
          docker exec "${container_id}" test -x \
            /home/kasm-default-profile/Desktop/Renders.desktop
          docker exec --env HOME=/home/kasm-user "${container_id}" \
            xdg-mime query default image/png \
            | grep --extended-regexp 'ristretto\.desktop$'
      - name: Pull immutable image for the local security scan
        run: docker pull "${{ steps.image.outputs.ref }}"
      - name: Scan immutable image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          timeout: 30m0s
      - name: Prove RunPod can pull the manifest anonymously
        shell: bash
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${{ steps.image.outputs.ref }}"
